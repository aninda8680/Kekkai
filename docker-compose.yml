services:
  db:
    image: postgres:15-alpine
    container_name: cloak-env_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloak-env
    ports:
      - "5432:5432"
    volumes:
      - cloak-env_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloak-env_redis
    ports:
      - "6379:6379"
    volumes:
      - cloak-env_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cloak-env_db_data:
  cloak-env_redis_data:
