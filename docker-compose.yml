version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kekkai_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kekkai
    ports:
      - "5432:5432"
    volumes:
      - kekkai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kekkai_redis
    ports:
      - "6379:6379"
    volumes:
      - kekkai_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kekkai_db_data:
  kekkai_redis_data:
