name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gitleaks secret scan — runs FIRST before anything else ──────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Dependency audit ────────────────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --workspaces
      - run: npm audit --audit-level=high --workspaces 2>&1 | tee audit.log
      - run: |
          # Fail if any HIGH or CRITICAL vulnerabilities
          if grep -qE '"severity":\s*"(high|critical)"' audit.log 2>/dev/null; then
            echo "::error::High/critical vulnerabilities found"
            exit 1
          fi

  # ── TypeScript typecheck ─────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --workspaces
      - run: npx tsc --noEmit
        working-directory: apps/api
      - run: npx tsc --noEmit
        working-directory: packages/cli

  # ── Tests with real Postgres ─────────────────────────────────────────────
  test:
    name: Tests (vitest + Postgres)
    runs-on: ubuntu-latest
    needs: [gitleaks, typecheck]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kekkai_test
          POSTGRES_PASSWORD: kekkai_test_pw
          POSTGRES_DB: kekkai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kekkai_test:kekkai_test_pw@localhost:5432/kekkai_test
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-test-jwt-secret-must-be-32-chars-long' }}
      MASTER_KEK: ${{ secrets.CI_MASTER_KEK || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --workspaces

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Run security tests
        run: npx vitest run --reporter=verbose
        working-directory: apps/api

      # Assert: canary value never in test output
      - name: Check test output for canary leaks
        run: |
          if grep -r 'CANARY_SECRET_VALUE' apps/api/coverage 2>/dev/null; then
            echo "::error::Canary value found in coverage output — possible secret leak"
            exit 1
          fi

  # ── Prisma migration dry-run check ──────────────────────────────────────
  migrate-check:
    name: Migration dry-run
    runs-on: ubuntu-latest
    needs: [test]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kekkai
          POSTGRES_PASSWORD: kekkai_pw
          POSTGRES_DB: kekkai
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kekkai:kekkai_pw@localhost:5432/kekkai

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --workspaces
      - name: Prisma migrate deploy (dry-run against fresh DB)
        run: npx prisma migrate deploy
        working-directory: apps/api

  # ── Container image scan (Trivy) ─────────────────────────────────────────
  trivy:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t kekkai-api:ci .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kekkai-api:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
